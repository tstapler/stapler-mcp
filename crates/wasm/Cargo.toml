[package]
name = "stapler-mcp-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
stapler-mcp-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
schemars = "1.0"
url = "2"

[dev-dependencies]
# Pinned to the same 0.2.x line as `wasm-bindgen` above (both resolve to
# 0.2.126 in Cargo.lock) — `wasm-bindgen-test`'s generated harness must match
# the `wasm-bindgen` version producing the test binary's JS glue, or
# `wasm-pack test` fails at load time with a version-mismatch error.
wasm-bindgen-test = "0.3"
# Test-only, mirroring `crates/core/Cargo.toml`'s identical dev-dependency:
# `#[tokio::test]` for `crates/wasm/src/browser.rs`'s `CredentialStore`
# tests, which need to `.await` a `FakeCredentialStore::resolve` call under
# plain `cargo test` (a host-target build, not wasm32 — see that file's
# `wasm_pack_tests` module doc comment for the distinction).
tokio = { version = "1", features = ["rt", "macros"] }
