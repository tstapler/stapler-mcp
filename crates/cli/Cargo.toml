[package]
name = "stapler-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stapler-mcp"
path = "src/main.rs"

[dependencies]
stapler-mcp-core = { path = "../core" }
stapler-mcp-native = { path = "../native" }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync", "signal"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio-util = "0.7"
# `FutureExt::catch_unwind`, used by `run_daemon`'s bridge consumer to turn a
# panicking tool handler into an error `Response` instead of taking the
# whole daemon process down with it.
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
# Plain-HTTP only (127.0.0.1, no TLS) — no TLS backend feature needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
